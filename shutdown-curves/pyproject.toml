[project]
name = "nl-dc-shutdown-curves"
version = "0.1.0"
description = "Historical Dutch electricity cost and production-carbon curves versus data-center uptime"
requires-python = ">=3.12"
dependencies = ["matplotlib>=3.10", "numpy>=2.2", "pandas>=2.2", "requests>=2.32"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
shutdown-curves = "dc_shutdown.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dc_shutdown"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
